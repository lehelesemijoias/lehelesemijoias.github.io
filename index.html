<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Le Helê · Vitrine Virtual</title>
<meta name="description" content="Semi joias Le Helê. Para a mais bela das belas.">
<meta name="theme-color" content="#D0BFA8">
<!-- Prévia do link no WhatsApp/Instagram. Se o endereço do site mudar, troque "https://lehele.github.io/" nas 2 linhas abaixo. -->
<meta property="og:title" content="Le Helê · Vitrine Virtual">
<meta property="og:description" content="Semi joias Le Helê. Para a mais bela das belas.">
<meta property="og:type" content="website">
<meta property="og:image" content="https://lehele.github.io/assets/og.jpg">
<meta property="og:url" content="https://lehele.github.io/">
<link rel="icon" href="assets/icone-192.png">
<link rel="apple-touch-icon" href="assets/icone-192.png">
<link rel="manifest" href="manifest.json">
<link rel="preload" href="assets/GFSDidot.ttf" as="font" type="font/ttf" crossorigin>
<style>
@font-face{font-family:"LH Didot";src:url(assets/GFSDidot.ttf) format("truetype");font-display:block}
:root{
  --taupe:#D0BFA8;--cream:#EBDECA;--gold:#C8A96A;--deep:#A9823E;--ink:#4A3A22;--soft:#8A7150;--paper:#F4ECDF;--cat:#6E5122;
  --s:min(100vw,56.25vh);
}
@supports (height:100dvh){:root{--s:min(100vw,56.25dvh)}}
:root{--u:calc(var(--s)/405)}
html,body{margin:0;height:100%;overflow:hidden;background:var(--taupe);-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{font-family:"LH Didot","GFS Didot",Didot,"Bodoni 72",Georgia,serif;color:var(--ink);-webkit-font-smoothing:antialiased}
#app{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--taupe);transition:background-color .25s}
.st{position:relative;width:var(--s);height:calc(var(--s)*16/9);overflow:hidden;animation:entra .22s ease-out}
@keyframes entra{from{opacity:.35}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.st{animation:none}#app{transition:none}}
.st>*{position:absolute;margin:0;box-sizing:border-box}
.t{white-space:nowrap;font-kerning:none;line-height:1.15}
.b{-webkit-text-stroke:var(--sw) currentColor}
a{color:inherit;text-decoration:none;-webkit-tap-highlight-color:rgba(169,130,62,.2)}
a.hit{z-index:3}
a.nav::before{content:"";position:absolute;inset:calc(var(--u)*-10) calc(var(--u)*-10)}
a:focus-visible{outline:2px solid var(--deep);outline-offset:2px;border-radius:4px}
.im{object-fit:cover;display:block}
.ct{object-fit:contain;display:block}
.pill{display:flex;align-items:center;justify-content:center;border-radius:999px;white-space:nowrap}
.clamp{white-space:normal;overflow:hidden;display:-webkit-box;-webkit-box-orient:vertical}
.msg{position:fixed;inset:0;display:grid;place-items:center;text-align:center;padding:0 24px;background:var(--taupe)}
.msg h1{font-weight:400;font-size:30px;margin:14px 0 8px}
.msg p{margin:0 0 18px;color:var(--soft);font-size:16px;line-height:1.5}
.msg img{width:96px;height:90px;border-radius:50%;object-fit:cover;border:1px solid var(--deep)}
.msg button{font:inherit;font-size:14px;letter-spacing:.2em;text-transform:uppercase;padding:12px 26px;border-radius:999px;border:1px solid var(--deep);background:transparent;color:var(--ink);cursor:pointer}
.aviso{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:10;background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:999px;font-size:14px;letter-spacing:.04em;max-width:calc(100% - 32px);text-align:center;box-shadow:0 6px 20px rgba(40,30,15,.25)}
</style>
</head>
<body>
<div id="app" aria-live="polite">
  <div class="msg"><div><img src="assets/emblema.jpg" alt=""><p style="margin-top:14px">Carregando a vitrine…</p></div></div>
</div>
<div class="aviso" id="aviso" hidden></div>

<script src="config.js"></script>
<script src="lib/supabase.js"></script>
<script src="js/comum.js"></script>
<script src="js/vitrine.js"></script>
</body>
</html>
